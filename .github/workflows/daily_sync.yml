name: Sincronizacao Diaria ANS

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar snapshot da ANS
        run: |
          python -c "import fetcher; fetcher.garantir_snapshot_recente()"

      - name: Commit e push de novos snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/snapshots/*.csv
          if git diff --staged --quiet; then
            echo "Nenhum snapshot novo encontrado."
          else
            git commit -m "auto: sincroniza snapshot diario da ANS"
            git push
          fi
